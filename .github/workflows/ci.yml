name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build the app view and the simulator page
        run: npm run build

      - name: Unit tests (protocol, engine, MCP surface, failure drills)
        run: npm test

      - name: End-to-end (four servers, signed offers, the demo scenario)
        run: npm run e2e

      - name: Browser check (two kitchens, the real cards, the buttons)
        run: npx playwright install --with-deps chromium && npm run ui && npm run hosted
